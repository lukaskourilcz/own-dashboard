<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(../../../../../templates/carousel-studio/fonts/anton/anton-400.ttf)}
@font-face{font-family:Inter;font-weight:400;src:url(../../../../../templates/carousel-studio/fonts/inter/inter-400.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(../../../../../templates/carousel-studio/fonts/inter/inter-600.ttf)}
@font-face{font-family:Inter;font-weight:700;src:url(../../../../../templates/carousel-studio/fonts/inter/inter-700.ttf)}
html,body{margin:0;width:1080px;height:1350px;background:#0E0F12;overflow:hidden}
.photo{position:absolute;left:0;top:0;width:1080px;height:960px;background:url(photo.jpg) center top/cover;filter:grayscale(1)}
.fade{position:absolute;left:0;top:0;width:1080px;height:962px;background:linear-gradient(180deg,rgba(14,15,18,.35) 0%,rgba(14,15,18,0) 14%,rgba(14,15,18,0) 42%,rgba(14,15,18,.7) 72%,#0E0F12 100%)}

.block{position:absolute;left:72px;right:72px;bottom:84px}
.h{font-family:Anton;font-size:212px;line-height:.92;color:#fff;text-transform:uppercase;letter-spacing:.005em}
.h .b{color:#6EC1FF;text-transform:none}
.p{margin-top:36px;font:400 42px/1.3 Inter;color:#E6E7EA;max-width:880px}
.row{margin-top:48px;display:flex;align-items:center;gap:24px}
.pill{font:700 38px/1 Inter;color:#fff;background:transparent;border:3px solid #fff;padding:19px 31px;border-radius:999px}
</style></head><body>
<div class="photo"></div><div class="fade"></div>

<div class="block">
<div class="h">Sleduj<br><span class="b">DNESKAi</span></div>
<div class="p">pro všechny novinky ze světa AI a&nbsp;technologií.</div>
<div class="row"><span class="pill">@dneskai</span></div>
</div></body></html>
