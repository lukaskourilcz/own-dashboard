<!-- @dsCard group="Carousel" viewport="1400x760" subtitle="Premium launch offer (4) and the full carousel (8), 1080 × 1350 each, at 1/4 scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>devShark carousels</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:#E6EAE4;font-family:Inter,sans-serif;color:#132019}.row{display:flex;gap:10px;padding:0 24px 24px}.cell{width:270px;height:337.5px;overflow:hidden;position:relative;flex:none}.cell>div{transform:scale(0.25);transform-origin:0 0}h2{margin:24px 24px 12px;font:800 20px/1.1 Manrope,sans-serif;letter-spacing:-0.015em}</style></head><body><div id="root"></div>
<script type="text/babel" src="Carousel.jsx"></script>
<script type="text/babel">
function App() {
  const C = window.DevSharkCarousels;
  if (!C || !Object.values(window).find(v => v && typeof v === 'object' && v.Slide)) return <p style={{ padding: 24 }}>Bundle not built yet — the finished carousel is in “Direction B - Mixed colours.dc.html”.</p>;
  return (<>
    <h2>Premium launch offer · Ink · Pale · Green · Ink</h2>
    <div className="row">{C.PremiumCarousel().map((s, i) => <div className="cell" key={i}>{s}</div>)}</div>
    <h2>Full carousel · Ink · Pale · Pale · Ink · Green · Pale · Ink · Green</h2>
    <div className="row" style={{ flexWrap: 'wrap' }}>{C.FullCarousel().map((s, i) => <div className="cell" key={i}>{s}</div>)}</div>
  </>);
}
setTimeout(() => ReactDOM.createRoot(document.getElementById('root')).render(<App />), 50);
</script></body></html>
