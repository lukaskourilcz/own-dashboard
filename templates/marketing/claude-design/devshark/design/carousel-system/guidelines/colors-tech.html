<!-- @dsCard group="Colors" viewport="700x150" subtitle="Each logo's brand colour at 14% over white; labels stay ink" name="Tech-chip tints" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--brand-ink);background:#fff}.sw{display:flex;gap:12px;flex-wrap:wrap}.s{width:104px}.s i{display:block;height:64px;border-radius:8px;border:1px solid #D6DED3}.s b{display:block;font:500 12px/1.3 var(--font-body);margin-top:6px}.s small{display:block;font:400 11px/1.3 var(--font-mono);color:#3C4F43}.k{font:700 11px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:#3C4F43;margin-bottom:10px}</style></head><body><div class="sw"><div class="s"><i style="background:var(--tint-html)"></i><b>HTML</b><small>--tint-html</small></div><div class="s"><i style="background:var(--tint-css)"></i><b>CSS</b><small>--tint-css</small></div><div class="s"><i style="background:var(--tint-javascript)"></i><b>JavaScript</b><small>--tint-javascript</small></div><div class="s"><i style="background:var(--tint-typescript)"></i><b>TypeScript</b><small>--tint-typescript</small></div><div class="s"><i style="background:var(--tint-react)"></i><b>React</b><small>--tint-react</small></div><div class="s"><i style="background:var(--tint-nextjs)"></i><b>Next.js</b><small>--tint-nextjs</small></div><div class="s"><i style="background:var(--tint-nodejs)"></i><b>Node.js</b><small>--tint-nodejs</small></div></div></body></html>
