<!-- @dsCard group="Colors" viewport="700x160" subtitle="[data-theme=dark] — the website's dark theme; accent brightens to #4CAF50" name="Dark slide (ink)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--brand-ink);background:#fff}.sw{display:flex;gap:12px;flex-wrap:wrap}.s{width:104px}.s i{display:block;height:64px;border-radius:8px;border:1px solid #D6DED3}.s b{display:block;font:500 12px/1.3 var(--font-body);margin-top:6px}.s small{display:block;font:400 11px/1.3 var(--font-mono);color:#3C4F43}.k{font:700 11px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:#3C4F43;margin-bottom:10px}</style></head><body><div data-theme="dark" style="background:var(--bg);padding:12px;border-radius:10px"><div class="sw"><div class="s"><i style="background:var(--bg)"></i><b style="color:#E8EEF0">Background</b><small style="color:#9DB3BC">--bg</small></div><div class="s"><i style="background:var(--surface)"></i><b style="color:#E8EEF0">Surface</b><small style="color:#9DB3BC">--surface</small></div><div class="s"><i style="background:var(--elevated)"></i><b style="color:#E8EEF0">Elevated</b><small style="color:#9DB3BC">--elevated</small></div><div class="s"><i style="background:var(--text)"></i><b style="color:#E8EEF0">Text</b><small style="color:#9DB3BC">--text</small></div><div class="s"><i style="background:var(--text-2)"></i><b style="color:#E8EEF0">Secondary</b><small style="color:#9DB3BC">--text-2</small></div><div class="s"><i style="background:var(--accent)"></i><b style="color:#E8EEF0">Accent</b><small style="color:#9DB3BC">--accent</small></div><div class="s"><i style="background:var(--tint)"></i><b style="color:#E8EEF0">Tint</b><small style="color:#9DB3BC">--tint</small></div><div class="s"><i style="background:var(--hairline)"></i><b style="color:#E8EEF0">Hairline</b><small style="color:#9DB3BC">--hairline</small></div></div></div></body></html>
