<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--brand-ink);background:#fff}.sw{display:flex;gap:12px;flex-wrap:wrap}.s{width:104px}.s i{display:block;height:64px;border-radius:8px;border:1px solid #D6DED3}.s b{display:block;font:500 12px/1.3 var(--font-body);margin-top:6px}.s small{display:block;font:400 11px/1.3 var(--font-mono);color:#3C4F43}.k{font:700 11px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:#3C4F43;margin-bottom:10px}</style></head><body><div data-theme="green" style="background:var(--bg);padding:12px;border-radius:10px"><div class="sw"><div class="s"><i style="background:var(--bg)"></i><b style="color:#fff">Background</b><small style="color:#E3EFE1">--bg</small></div><div class="s"><i style="background:var(--text)"></i><b style="color:#fff">Text / accent</b><small style="color:#E3EFE1">--text</small></div><div class="s"><i style="background:var(--panel-bg)"></i><b style="color:#fff">Panel</b><small style="color:#E3EFE1">--panel-bg</small></div><div class="s"><i style="background:var(--panel-text)"></i><b style="color:#fff">Panel text</b><small style="color:#E3EFE1">--panel-text</small></div><div class="s"><i style="background:var(--panel-text-2)"></i><b style="color:#fff">Panel secondary</b><small style="color:#E3EFE1">--panel-text-2</small></div><div class="s"><i style="background:var(--panel-accent)"></i><b style="color:#fff">Panel accent</b><small style="color:#E3EFE1">--panel-accent</small></div><div class="s"><i style="background:var(--panel-tint)"></i><b style="color:#fff">Panel tint</b><small style="color:#E3EFE1">--panel-tint</small></div><div class="s"><i style="background:var(--chip-bg)"></i><b style="color:#fff">Chip fill</b><small style="color:#E3EFE1">--chip-bg</small></div></div></div></body></html>
