<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--brand-ink);background:#fff}.sw{display:flex;gap:12px;flex-wrap:wrap}.s{width:104px}.s i{display:block;height:64px;border-radius:8px;border:1px solid #D6DED3}.s b{display:block;font:500 12px/1.3 var(--font-body);margin-top:6px}.s small{display:block;font:400 11px/1.3 var(--font-mono);color:#3C4F43}.k{font:700 11px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:#3C4F43;margin-bottom:10px}</style></head><body><div class="sw"><div class="s"><i style="background:var(--brand-green)"></i><b>Green</b><small>--brand-green</small></div><div class="s"><i style="background:var(--brand-green-800)"></i><b>Green 800</b><small>--brand-green-800</small></div><div class="s"><i style="background:var(--brand-green-100)"></i><b>Green 100</b><small>--brand-green-100</small></div><div class="s"><i style="background:var(--brand-ink)"></i><b>Ink</b><small>--brand-ink</small></div><div class="s"><i style="background:var(--brand-ink-700)"></i><b>Ink 700</b><small>--brand-ink-700</small></div><div class="s"><i style="background:var(--brand-pale)"></i><b>Pale</b><small>--brand-pale</small></div><div class="s"><i style="background:var(--brand-line)"></i><b>Line</b><small>--brand-line</small></div><div class="s"><i style="background:var(--brand-white)"></i><b>White</b><small>--brand-white</small></div></div></body></html>
