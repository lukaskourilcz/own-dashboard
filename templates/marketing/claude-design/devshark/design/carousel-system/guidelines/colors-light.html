<!-- @dsCard group="Colors" viewport="700x150" subtitle="Default theme: ink type on pale paper, white panels" name="Light slide (pale)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--brand-ink);background:#fff}.sw{display:flex;gap:12px;flex-wrap:wrap}.s{width:104px}.s i{display:block;height:64px;border-radius:8px;border:1px solid #D6DED3}.s b{display:block;font:500 12px/1.3 var(--font-body);margin-top:6px}.s small{display:block;font:400 11px/1.3 var(--font-mono);color:#3C4F43}.k{font:700 11px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:#3C4F43;margin-bottom:10px}</style></head><body><div class="sw"><div class="s"><i style="background:var(--bg)"></i><b>Background</b><small>--bg</small></div><div class="s"><i style="background:var(--surface)"></i><b>Surface</b><small>--surface</small></div><div class="s"><i style="background:var(--text)"></i><b>Text</b><small>--text</small></div><div class="s"><i style="background:var(--text-2)"></i><b>Secondary</b><small>--text-2</small></div><div class="s"><i style="background:var(--accent)"></i><b>Accent</b><small>--accent</small></div><div class="s"><i style="background:var(--tint)"></i><b>Tint</b><small>--tint</small></div><div class="s"><i style="background:var(--hairline)"></i><b>Hairline</b><small>--hairline</small></div><div class="s"><i style="background:var(--chip-bg)"></i><b>Chip fill</b><small>--chip-bg</small></div></div></body></html>
