name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a new push lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install ffprobe
        # The reel renderer test (tests/lib/dneskai-reel-render.test.ts) checks its MP4 with ffprobe;
        # the encoder itself is the ffmpeg-static binary from npm.
        # The runner's package index is usually fresh enough; a full `apt-get update` sometimes hung for the whole
        # job timeout, so it only runs when the plain install fails, and the step gives up after a few minutes.
        timeout-minutes: 6
        run: |
          sudo apt-get install -y -q --no-install-recommends ffmpeg \
            || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg; }
          ffprobe -version | head -1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        # Dummy values are fine — build only needs them to exist as strings.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
        run: npm run build

      - name: Check render traces
        # Each marketing route that renders or inspects images must trace libvips, the sharp addon and
        # the vendored studio fonts into its function (#117, docs/marketing-render-preflight.md).
        run: npm run check:render-traces

  e2e:
    # ubuntu-latest moved to 26.04, where Playwright 1.56 cannot install Chromium. Pinned until Playwright is upgraded.
    runs-on: ubuntu-24.04
    # 254 cases run in about 6 minutes, but runner setup and the production build
    # have taken up to 9 minutes on their own; 15 cancelled a passing run.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright + axe-core)
        # The dev server reads these via playwright.config.ts → webServer.env;
        # set them here too so nothing else trips on missing values.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
